{
  "test_case": "date correction reruns availability",
  "mocked_datetime": "2026-06-29T12:00:00.000Z",
  "steps": [
    {
      "user": "Are you available October 17 2026 in Tampa?",
      "assert": {
        "toolCalled": "check_wedding_availability",
        "slot_was_set": {
          "weddingDate": "2026-10-17"
        }
      }
    },
    {
      "user": "Actually it may be October 18 2026",
      "assert": {
        "toolCalled": "check_wedding_availability",
        "slot_was_set": {
          "weddingDate": "2026-10-18"
        },
        "contains": "October 18, 2026"
      }
    }
  ]
}
