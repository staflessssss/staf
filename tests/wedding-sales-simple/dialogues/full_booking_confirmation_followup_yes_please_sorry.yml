{
  "test_case": "full booking confirmation followup yes please sorry",
  "mocked_datetime": "2026-06-29T12:00:00.000Z",
  "steps": [
    {
      "user": "Hi, do you have availability for October 17 2026 in Tampa?",
      "assert": {
        "responseKey": "utter_availability_available_ask_names",
        "toolCalled": "check_wedding_availability",
        "attachmentPurpose": "pricing_guide",
        "followUpsScheduled": {
          "slot": "names",
          "stages": ["day_1", "day_3", "day_7"]
        }
      }
    },
    {
      "user": "Rick and Rachel",
      "assert": {
        "responseKey": "utter_ask_venue",
        "slot_was_set": {
          "names": "Rick and Rachel"
        }
      }
    },
    {
      "user": "The Vinoy",
      "assert": {
        "responseKey": "utter_venue_collected_ask_call_time",
        "slot_was_set": {
          "venue": "The Vinoy"
        }
      }
    },
    {
      "user": "Can we call 2026-06-30T10:00:00-04:00?",
      "assert": {
        "responseKey": "utter_calendar_available_ask_email",
        "toolCalled": "check_consultation_calendar"
      }
    },
    {
      "user": "rick@example.com",
      "assert": {
        "contains": "lock in",
        "pendingUserAction": {
          "type": "booking_confirmation"
        },
        "followUpsScheduled": {
          "slot": "bookingConfirmation",
          "stages": ["day_1", "day_3", "day_7"]
        }
      }
    },
    {
      "user": "Yes, please, sorry",
      "assert": {
        "toolCalled": "book_consultation",
        "bookingConfirmed": true,
        "pendingUserAction": null,
        "doesNotContain": "Want me to lock in"
      }
    },
    {
      "user": "Thanks, see you later!",
      "assert": {
        "responseKey": "utter_acknowledgement",
        "toolNotCalled": "book_consultation",
        "doesNotContain": ["calendar invite", "locked in", "Want me to lock in"]
      }
    }
  ]
}
