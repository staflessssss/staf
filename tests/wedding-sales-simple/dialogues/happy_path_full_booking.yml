{
  "test_case": "happy path full booking",
  "mocked_datetime": "2026-06-29T12:00:00.000Z",
  "steps": [
    {
      "user": "Hi, do you have availability for October 17 2026 in Tampa?",
      "assert": {
        "responseKey": "utter_availability_available_ask_names",
        "toolCalled": "check_wedding_availability",
        "attachmentPurpose": "pricing_guide",
        "followUpsScheduled": {
          "slot": "names",
          "stages": ["day_1", "day_3", "day_7"]
        },
        "contains": ["October 17, 2026", "What are both of your names?"]
      }
    },
    {
      "user": "Rick and Rachel",
      "assert": {
        "slot_was_set": {
          "names": "Rick and Rachel"
        },
        "responseKey": "utter_ask_venue"
      }
    },
    {
      "user": "The Vinoy",
      "assert": {
        "slot_was_set": {
          "venue": "The Vinoy"
        },
        "responseKey": "utter_venue_collected_ask_call_time"
      }
    },
    {
      "user": "Can we call tomorrow at 10am?",
      "assert": {
        "toolCalled": "check_consultation_calendar",
        "responseKey": "utter_calendar_available_ask_email"
      }
    },
    {
      "user": "rick@example.com",
      "assert": {
        "slot_was_set": {
          "email": "rick@example.com"
        },
        "contains": "lock in"
      }
    }
  ]
}
