{
  "test_case": "followup names 1 3 7 cancel on reply",
  "mocked_datetime": "2026-06-29T12:00:00.000Z",
  "steps": [
    {
      "user": "Hi, are you available for October 17 2026 in Tampa?",
      "assert": {
        "responseKey": "utter_availability_available_ask_names",
        "followUpsScheduled": {
          "slot": "names",
          "stages": ["day_1", "day_3", "day_7"]
        }
      }
    },
    {
      "cron": "+1d",
      "assert": {
        "followUpSent": {
          "slot": "names",
          "stage": "day_1"
        },
        "contains": "couple"
      }
    },
    {
      "user": "Rick and Rachel",
      "assert": {
        "slot_was_set": {
          "names": "Rick and Rachel"
        },
        "responseKey": "utter_ask_venue"
      }
    },
    {
      "cron": "+3d",
      "assert": {
        "toolNotCalled": "book_consultation"
      }
    }
  ]
}
